name: Kaggle GPU Pilot Evaluation

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kaggle-pilot-gpu
  cancel-in-progress: false

jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      SUPABASE_URL: ${{ vars.SUPABASE_URL || 'https://fmwxftnistkoqazfwnuj.supabase.co' }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      KAGGLE_KERNEL_SLUG: debatt-ai-pilot-gpu
      KAGGLE_RESULT_FILE: pilot_results.json
      EXPERIMENT_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Ensure credentials are set
        run: |
          for name in KAGGLE_USERNAME KAGGLE_API_TOKEN SUPABASE_ANON_KEY; do
            test -n "${!name}" || { echo "::error::$name secret missing"; exit 1; }
          done
      - name: Install Kaggle CLI
        run: python -m pip install 'kaggle>=1.8,<2'
      - name: Export and verify the frozen test set
        env:
          # Optional, read-only (GET): AI-agent submissions for the private Kaggle dataset only.
          # Step scope, so no other step or tool (such as the Kaggle CLI) sees the key.
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python scripts/export_supabase.py --output eval-data --frozen evals/frozen/v1.json
      - name: Upload private Kaggle dataset
        run: bash scripts/upload_kaggle_dataset.sh eval-data
      - name: Prepare pilot kernel
        run: python scripts/prepare_kaggle_kernel.py --task pilot --sha "$GITHUB_SHA" --username "$KAGGLE_USERNAME" --run-id "$EXPERIMENT_RUN_ID" --output kaggle-submission
      - name: Run pilot on Kaggle GPU and retrieve results
        run: bash scripts/run_kaggle_kernel.sh
      - name: Summarize results
        if: success()
        run: |
          # tee: the table also lands in the job log, which can be read without opening the run page.
          set -o pipefail
          python - <<'PY' | tee -a "$GITHUB_STEP_SUMMARY"
          import json
          r = json.load(open("kaggle-results/pilot_results.json", encoding="utf-8"))
          b, k = r["baselines"], ("arg", "ori", "rel", "tro")
          f = lambda v: "-" if v is None else f"{v:.2f}"
          print("## Pilot evaluation\n")
          print(f"{r['editor_items']} editor articles, {r['market_items']} resolved markets, GPU {r['gpu_name']}\n")
          print("| Model | Editor parsed | Distinct answers | MAE arg/ori/rel/tro | Spearman arg/ori/rel/tro | Answer spread (std) arg/ori/rel/tro | Markets parsed | Distinct | Brier (all) | Brier (consensus markets) |")
          print("| --- | --- | --- | --- | --- | --- | --- | --- | --- | --- |")
          for m in r["models"]:
              e, mk = m["editor"], m["markets"]
              print(f"| {m['id']} | {e['parsed']}/{e['n']} | {e['distinct_predictions'] if e['distinct_predictions'] is not None else '-'} | {' / '.join(f(e[x]['mae']) for x in k)} "
                    f"| {' / '.join(f(e[x]['spearman']) for x in k)} | {' / '.join(f(e[x]['prediction_std']) for x in k)} "
                    f"| {mk['parsed']}/{mk['n']} | {mk['distinct_predictions'] if mk['distinct_predictions'] is not None else '-'} | {f(mk['brier'])} | {f(mk['brier_consensus_markets'])} |")
          t = b["editor_train_mean"]
          print(f"\nEditor truth spread (std) arg/ori/rel/tro: {' / '.join(f(t[x]['truth_std']) for x in k)}")
          print(f"\nBaselines: editor training mean → MAE {' / '.join(f(t[x]['mae']) for x in k)}; "
                f"market base rate {b['train_base_rate']:.2f} → Brier {f(b['base_rate_brier'])} (all), "
                f"{f(b['base_rate_brier_consensus_markets'])} (consensus markets); "
                f"agent consensus (bets by creation day) Brier {f(b['agent_consensus_brier'])} on {b['agent_consensus_markets']} markets")
          print("\nUnparsable replies are scored, not dropped: training-mean scores for the editor, 50% for markets.")
          print("Distinct answers and spread count parsed replies only. A model with 1 distinct answer is repeating itself; its MAE says nothing about individual items.\n")
          for m in r["models"]:
              print(f"Revision {m['id']}: `{m['revision']}`  ")
          PY
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kaggle-pilot-${{ github.run_id }}
          path: kaggle-results/
          if-no-files-found: warn
