name: Export Debatt-AI Data

on:
  workflow_dispatch:
    inputs:
      test_from:
        description: "First UTC date (YYYY-MM-DD) of the test split. Empty = use evals/frozen/v1.json if present, else 90 days ago."
        required: false
        default: ""
      test_until:
        description: "Last UTC date (YYYY-MM-DD) of the test split, in the past. Empty = no limit."
        required: false
        default: ""
      freeze:
        description: "Write the test set's ids and fingerprints (needs test_from and test_until)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Public tables are read with the anon key: exactly what RLS exposes on debatt-ai.se.
      SUPABASE_URL: ${{ vars.SUPABASE_URL || 'https://fmwxftnistkoqazfwnuj.supabase.co' }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      # Optional, read-only (GET): AI-agent submissions in inlamningar, which RLS hides from anon.
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      TEST_FROM: ${{ inputs.test_from }}
      TEST_UNTIL: ${{ inputs.test_until }}
      FREEZE: ${{ inputs.freeze }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Ensure credentials are set
        run: test -n "$SUPABASE_ANON_KEY" || { echo "::error::SUPABASE_ANON_KEY secret missing"; exit 1; }
      - name: Export time-split dataset
        run: |
          out="data/export-${GITHUB_RUN_ID}"
          args=(--output "$out")
          # Once a test set is frozen, every export verifies it unless a new window is given explicitly.
          if [ -z "$TEST_FROM$TEST_UNTIL" ] && [ -f evals/frozen/v1.json ]; then
            args+=(--frozen evals/frozen/v1.json)
          fi
          [ -n "$TEST_FROM" ] && args+=(--test-from "$TEST_FROM")
          [ -n "$TEST_UNTIL" ] && args+=(--test-until "$TEST_UNTIL")
          [ "$FREEZE" = "true" ] && args+=(--write-frozen "$out/frozen-test-set.json")
          python scripts/export_supabase.py "${args[@]}"
          # Artifacts of a public repository can be downloaded by any GitHub user, so the submission texts
          # stay out of it; the manifest keeps their counts. The private Kaggle dataset gets the full file.
          rm -f "$out/inlamningar.jsonl"
          cat "$out/manifest.json"
      - name: Upload dataset
        uses: actions/upload-artifact@v4
        with:
          name: debatt-ai-data-${{ github.run_id }}
          path: data/export-${{ github.run_id }}/
          retention-days: 90
