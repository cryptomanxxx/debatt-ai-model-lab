name: AI Model Training (Kaggle GPU)

on:
  workflow_dispatch:
    inputs:
      retrieve_run:
        description: "Only fetch an earlier run's Kaggle result (e.g. 39147257612-1), when its GitHub job hit the 6-hour limit while Kaggle kept running. Empty = train."
        required: false
        default: ""
      retrieve_sha:
        description: "Full commit SHA that earlier run trained (shown on its run page). Required with retrieve_run."
        required: false
        default: ""

permissions:
  contents: read

# Shares the evaluation workflow's group: both upload the same private Kaggle dataset.
concurrency:
  group: kaggle-pilot-gpu
  cancel-in-progress: false

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      SUPABASE_URL: ${{ vars.SUPABASE_URL || 'https://fmwxftnistkoqazfwnuj.supabase.co' }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      KAGGLE_KERNEL_SLUG: debatt-ai-train-editor-gpu
      KAGGLE_RESULT_FILE: train_results.json
      # Training plus two evaluations needs more than the evaluation workflow's 95 minutes.
      KAGGLE_KERNEL_TIMEOUT: "19800"
      KAGGLE_MAX_POLLS: "340"
      # Retrieval checks the earlier run's provenance instead of this run's.
      EXPERIMENT_RUN_ID: ${{ inputs.retrieve_run || format('{0}-{1}', github.run_id, github.run_attempt) }}
      EXPECTED_SHA: ${{ inputs.retrieve_sha || github.sha }}
      KAGGLE_RETRIEVE_ONLY: ${{ inputs.retrieve_run != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Ensure credentials are set
        env:
          # Only checked for presence here; the export step is the only one that uses it.
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          for name in KAGGLE_USERNAME KAGGLE_API_TOKEN SUPABASE_ANON_KEY SUPABASE_SERVICE_ROLE_KEY; do
            test -n "${!name}" || { echo "::error::$name secret missing"; exit 1; }
          done
      - name: Check retrieval inputs
        if: inputs.retrieve_run != ''
        env:
          RETRIEVE_RUN: ${{ inputs.retrieve_run }}
          RETRIEVE_SHA: ${{ inputs.retrieve_sha }}
        run: |
          [[ "$RETRIEVE_RUN" =~ ^[0-9]+-[0-9]+$ ]] || { echo "::error::retrieve_run must look like 39147257612-1"; exit 1; }
          [[ "$RETRIEVE_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::retrieve_sha must be a full 40-character commit SHA"; exit 1; }
      - name: Install Kaggle CLI
        run: python -m pip install 'kaggle>=2.2,<3'
      - name: Export and verify the frozen test set
        if: inputs.retrieve_run == ''
        env:
          # Read-only (GET): AI-agent submissions, frozen in v1, for the private Kaggle dataset only.
          # Step scope, so no other step or tool (such as the Kaggle CLI) sees the key.
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python scripts/export_supabase.py --output eval-data --frozen evals/frozen/v1.json
      - name: Upload private Kaggle dataset
        if: inputs.retrieve_run == ''
        run: bash scripts/upload_kaggle_dataset.sh eval-data
      - name: Prepare training kernel
        if: inputs.retrieve_run == ''
        run: python scripts/prepare_kaggle_kernel.py --task train --sha "$GITHUB_SHA" --username "$KAGGLE_USERNAME" --run-id "$EXPERIMENT_RUN_ID" --output kaggle-submission
      - name: Train on Kaggle GPU and retrieve results
        run: bash scripts/run_kaggle_kernel.sh
      - name: Summarize results
        if: success()
        run: |
          # tee: the tables also land in the job log, which can be read without opening the run page.
          set -o pipefail
          python - <<'PY' | tee -a "$GITHUB_STEP_SUMMARY"
          import json
          r = json.load(open("kaggle-results/train_results.json", encoding="utf-8"))
          k = ("arg", "ori", "rel", "tro")
          f = lambda v: "-" if v is None else f"{v:.2f}"
          c, t, cfg = r["counts"], r["training"], r["config"]
          print("## Editor training (QLoRA)\n")
          print(f"{c['train_examples']} training examples from {c['train_rows']} submissions "
                f"({c['train_held_rows']} not published, each repeated {c['held_weight']}x for a {cfg['held_share']:.0%} share); "
                f"{c['train_examples_too_long']} too long; {t['steps']} steps; reasoning {'on' if cfg['reasoning'] else 'off'}; "
                f"loss {t['loss_first_50']:.3f} (first 50) → {t['loss_last_50']:.3f} (last 50). GPU {r['gpu_name']}\n")
          print("Release bar: on submissions and articles, beat the training-mean answer on MAE (interval below zero) and "
                "rank texts like the editor (Spearman above zero); on submissions, also beat the base on MAE and hold "
                "back texts (balanced accuracy above 0.50).\n")
          titles = {"validation": "Validation (last days before the test window)", "editor": "Editor articles (test)",
                    "film_reviews": "Film reviews (test)", "submissions": "Submissions (test)"}
          for key in cfg["tuned_eval_tasks"]:
              print(f"### {titles[key]}\n")
              print("| Model | Parsed | Distinct | MAE arg/ori/rel/tro | Spearman arg/ori/rel/tro | Balanced accuracy |")
              print("| --- | --- | --- | --- | --- | --- |")
              for name, label in (("train_mean", "training mean"), ("base", "base"), ("tuned", "tuned")):
                  m = r.get(name, {}).get(key)
                  if not m:
                      continue
                  bal = m["decision"]["balanced_accuracy"] if "decision" in m else None
                  print(f"| {label} | {m['parsed']}/{m['n']} | {m['distinct_predictions'] if m['distinct_predictions'] is not None else '-'} "
                        f"| {' / '.join(f(m[x]['mae']) for x in k)} | {' / '.join(f(m[x]['spearman']) for x in k)} | {f(bal)} |")
              for diff_key, against in (("tuned_minus_train_mean", "training mean"), ("tuned_minus_base", "base")):
                  diff = r.get(diff_key, {}).get(key)
                  if diff:
                      print(f"\nMAE tuned − {against} (95% bootstrap interval; below zero = better): " + "; ".join(
                          f"{x} {diff[x]['mae_diff']:+.2f} [{diff[x]['ci95'][0]:+.2f}, {diff[x]['ci95'][1]:+.2f}]" for x in k))
              print()
          print("Minutes per phase: " + "; ".join(f"{n} {s / 60:.0f}" for n, s in r.get("phase_seconds", {}).items()) + "\n")
          print(f"Revision {cfg['model']['id']}: `{cfg['model']['revision']}`")
          PY
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kaggle-train-${{ github.run_id }}
          # JSON and logs only: the trained adapter stays in the private Kaggle output.
          path: |
            kaggle-results/*.json
            kaggle-results/*.log
          if-no-files-found: warn
