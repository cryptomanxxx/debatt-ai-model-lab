name: AI Model Training (Kaggle GPU)

on:
  workflow_dispatch:

permissions:
  contents: read

# Shares the evaluation workflow's group: both upload the same private Kaggle dataset.
concurrency:
  group: kaggle-pilot-gpu
  cancel-in-progress: false

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      SUPABASE_URL: ${{ vars.SUPABASE_URL || 'https://fmwxftnistkoqazfwnuj.supabase.co' }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      KAGGLE_KERNEL_SLUG: debatt-ai-train-editor-gpu
      KAGGLE_RESULT_FILE: train_results.json
      # Training plus two evaluations needs more than the evaluation workflow's 95 minutes.
      KAGGLE_KERNEL_TIMEOUT: "19800"
      KAGGLE_MAX_POLLS: "340"
      EXPERIMENT_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Ensure credentials are set
        env:
          # Only checked for presence here; the export step is the only one that uses it.
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          for name in KAGGLE_USERNAME KAGGLE_API_TOKEN SUPABASE_ANON_KEY SUPABASE_SERVICE_ROLE_KEY; do
            test -n "${!name}" || { echo "::error::$name secret missing"; exit 1; }
          done
      - name: Install Kaggle CLI
        run: python -m pip install 'kaggle>=2.2,<3'
      - name: Export and verify the frozen test set
        env:
          # Read-only (GET): AI-agent submissions, frozen in v1, for the private Kaggle dataset only.
          # Step scope, so no other step or tool (such as the Kaggle CLI) sees the key.
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python scripts/export_supabase.py --output eval-data --frozen evals/frozen/v1.json
      - name: Upload private Kaggle dataset
        run: bash scripts/upload_kaggle_dataset.sh eval-data
      - name: Prepare training kernel
        run: python scripts/prepare_kaggle_kernel.py --task train --sha "$GITHUB_SHA" --username "$KAGGLE_USERNAME" --run-id "$EXPERIMENT_RUN_ID" --output kaggle-submission
      - name: Train on Kaggle GPU and retrieve results
        run: bash scripts/run_kaggle_kernel.sh
      - name: Summarize results
        if: success()
        run: |
          # tee: the tables also land in the job log, which can be read without opening the run page.
          set -o pipefail
          python - <<'PY' | tee -a "$GITHUB_STEP_SUMMARY"
          import json
          r = json.load(open("kaggle-results/train_results.json", encoding="utf-8"))
          k = ("arg", "ori", "rel", "tro")
          f = lambda v: "-" if v is None else f"{v:.2f}"
          c, t = r["counts"], r["training"]
          print("## Editor training (QLoRA)\n")
          print(f"{c['train_examples']} training examples from {c['train_rows']} submissions "
                f"({c['train_held_rows']} not published, each repeated {r['config']['held_weight']}x); "
                f"{c['train_examples_too_long']} too long; {t['steps']} steps; "
                f"loss {t['loss_first_50']:.3f} (first 50) → {t['loss_last_50']:.3f} (last 50). GPU {r['gpu_name']}\n")
          tasks = [("validation", "Validation (last days before the test window)"), ("editor", "Editor articles (test)"),
                   ("film_reviews", "Film reviews (test)"), ("submissions", "Submissions (test)")]
          for key, title in tasks:
              print(f"### {title}\n")
              print("| Model | Parsed | Distinct | MAE arg/ori/rel/tro | Spearman arg/ori/rel/tro | Balanced accuracy |")
              print("| --- | --- | --- | --- | --- | --- |")
              for name in ("base", "tuned"):
                  if name not in r:
                      continue
                  m = r[name][key]
                  bal = m["decision"]["balanced_accuracy"] if "decision" in m else None
                  print(f"| {name} | {m['parsed']}/{m['n']} | {m['distinct_predictions'] if m['distinct_predictions'] is not None else '-'} "
                        f"| {' / '.join(f(m[x]['mae']) for x in k)} | {' / '.join(f(m[x]['spearman']) for x in k)} | {f(bal)} |")
              diff = r.get("tuned_minus_base", {}).get(key)
              if diff:
                  print("\nMAE tuned − base (95% bootstrap interval; below zero = better): " + "; ".join(
                      f"{x} {diff[x]['mae_diff']:+.2f} [{diff[x]['ci95'][0]:+.2f}, {diff[x]['ci95'][1]:+.2f}]" for x in k))
              print()
          print(f"Revision {r['config']['model']['id']}: `{r['config']['model']['revision']}`")
          PY
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kaggle-train-${{ github.run_id }}
          # JSON and logs only: the trained adapter stays in the private Kaggle output.
          path: |
            kaggle-results/*.json
            kaggle-results/*.log
          if-no-files-found: warn
